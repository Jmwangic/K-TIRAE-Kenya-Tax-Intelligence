services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: kra_anomaly
      POSTGRES_USER: kra_app
      POSTGRES_PASSWORD: kra_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro

volumes:
  postgres_data:
