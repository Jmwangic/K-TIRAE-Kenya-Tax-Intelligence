services:
  - type: web
    name: k-tirae-dashboard
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    buildFilter:
      paths:
        - app/**
        - db/**
        - scripts/deploy_entrypoint.py
        - Dockerfile
        - requirements.txt
        - render.yaml
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: k-tirae-db-live
          property: connectionString
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: ADMIN_SETUP_TOKEN
        generateValue: true
      - key: ADMIN_COOKIE_SECURE
        value: "true"

databases:
  - name: k-tirae-db
    databaseName: kra_anomaly
    user: kra_app
    plan: free
  - name: k-tirae-db-live
    databaseName: kra_anomaly
    user: kra_app
    plan: free
