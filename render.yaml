services:
  - type: web
    name: k-tirae-dashboard
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: k-tirae-db
          property: connectionString

databases:
  - name: k-tirae-db
    databaseName: kra_anomaly
    user: kra_app
    plan: free
