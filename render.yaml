services:
  - type: web
    name: k-tirae-dashboard
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: k-tirae-db
          property: connectionString
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: ADMIN_SETUP_TOKEN
        generateValue: true
      - key: ADMIN_COOKIE_SECURE
        value: "true"

databases:
  - name: k-tirae-db
    databaseName: kra_anomaly
    user: kra_app
    plan: free
