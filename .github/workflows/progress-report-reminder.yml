name: Progress report reminder

on:
  schedule:
    # GitHub Actions schedules use UTC. This creates a two-hour reminder cadence.
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update checkpoint issue
        uses: actions/github-script@v8
        with:
          script: |
            const title = 'K-TIRAE two-hour progress checkpoint';
            const body = [
              'Record the current checkpoint in the active weekly report.',
              '',
              '- Work completed since the previous checkpoint:',
              '- Evidence (commit, test, screenshot, or decision):',
              '- Blocker or assumption:',
              '- Next two-hour action:',
              '',
              `UTC checkpoint: ${new Date().toISOString()}`
            ].join('\n');

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'progress-checkpoint'
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'progress-checkpoint',
                color: '1D76DB',
                description: 'Two-hour K-TIRAE delivery checkpoint'
              });
            }

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'progress-checkpoint'
            });

            if (openIssues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['progress-checkpoint']
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: openIssues[0].number,
                body
              });
            }

            const readmePath = 'README.md';
            const { data: readme } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: readmePath,
              ref: context.ref.replace('refs/heads/', '')
            });
            const currentReadme = Buffer.from(readme.content, 'base64').toString('utf8');
            const checkpointTime = new Date().toISOString();
            const sourceDocument = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'docs/K-TIRAE-project-brief.docx',
              ref: context.ref.replace('refs/heads/', '')
            });
            const sourceHash = require('crypto')
              .createHash('sha256')
              .update(Buffer.from(sourceDocument.data.content, 'base64'))
              .digest('hex');
            const workflowUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const progressBlock = [
              '<!-- K-TIRAE-PROGRESS:START -->',
              '## Live Progress',
              '',
              `- Last automated checkpoint: ${checkpointTime} UTC`,
              '- Current delivery phase: Week 1 - requirements, architecture, and data contract',
              `- Tracked brief SHA-256: \`${sourceHash}\``,
              '- Document review status: source tracked; requirement changes require human review',
              `- Checkpoint workflow: [view run](${workflowUrl})`,
              '- Detailed evidence: [weekly reports](reports/)',
              '',
              'The GitHub Actions checkpoint workflow updates this section every two hours in UTC.',
              '<!-- K-TIRAE-PROGRESS:END -->'
            ].join('\n');
            const updatedReadme = currentReadme.replace(
              /<!-- K-TIRAE-PROGRESS:START -->[\s\S]*?<!-- K-TIRAE-PROGRESS:END -->/,
              progressBlock
            );

            if (updatedReadme === currentReadme) {
              core.warning('README progress markers were not found; no README update was made.');
            } else {
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: readmePath,
                message: `Update two-hour progress checkpoint (${checkpointTime})`,
                content: Buffer.from(updatedReadme, 'utf8').toString('base64'),
                sha: readme.sha,
                branch: context.ref.replace('refs/heads/', '')
              });
            }