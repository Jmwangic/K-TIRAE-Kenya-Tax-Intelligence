name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kra_anomaly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kra_anomaly"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kra_anomaly
      ADMIN_SESSION_SECRET: ci-session-secret-value-with-at-least-32-characters
      ADMIN_SETUP_TOKEN: ci-setup-token-value-with-at-least-32-characters
      ADMIN_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Apply database migrations
        run: for migration in db/*.sql; do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"; done
      - run: pytest -q